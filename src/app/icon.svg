<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Favicon: logo "Tilted orbit", preta no navegador claro e branca no escuro -->
  <style>
    .fg { color: #111113; }
    .bg { --bg: #fafafa; }
    @media (prefers-color-scheme: dark) {
      .fg { color: #f2f2f3; }
      .bg { --bg: #0b0b0c; }
    }
  </style>
  <g class="fg bg" transform="rotate(-25 20 20)">
    <ellipse cx="20" cy="20" rx="17" ry="6" fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.4" />
    <circle cx="20" cy="20" r="8.5" fill="currentColor" />
    <path d="M3 20a17 6 0 0 0 34 0" fill="none" stroke="var(--bg)" stroke-width="5.5" />
    <path d="M3 20a17 6 0 0 0 34 0" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="29.2" cy="25" r="4.2" fill="var(--bg)" />
    <circle cx="29.2" cy="25" r="2.5" fill="currentColor" />
  </g>
</svg>
