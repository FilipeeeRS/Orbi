# Testes a cada push: confere tipos e lint, compila o site e roda os testes de ponta a ponta (Playwright).
# O relatório (com fotos das falhas) fica nos "Artifacts" da execução por 14 dias.
# Precisa dos secrets do repositório: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
# SUPABASE_SECRET_KEY e TMDB_API_KEY (opcional: E2E_EMAIL e E2E_PASSWORD, para os testes de quem está logado).
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      # Sem as chaves o site responde erro em toda página e os testes só param depois de 3 minutos esperando
      - name: Conferir os secrets
        run: |
          faltando=""
          for nome in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY TMDB_API_KEY; do
            [ -z "${!nome}" ] && faltando="$faltando $nome"
          done
          if [ -n "$faltando" ]; then
            echo "::error::Faltam os secrets do repositório:$faltando (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          # Valor colado com o nome junto ("NOME=valor"), com aspas ou com espaço sobrando
          for nome in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY TMDB_API_KEY; do
            valor="${!nome}"
            case "$valor" in *=*|*\"*|*\'*|*" "*) echo "::error::O secret $nome parece ter sido colado errado (com o nome, aspas ou espaços). Cole só o valor."; exit 1 ;; esac
          done
          case "$NEXT_PUBLIC_SUPABASE_URL" in https://*) ;; *) echo "::error::NEXT_PUBLIC_SUPABASE_URL tem que começar com https://"; exit 1 ;; esac
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos e lint
        # Os tipos das rotas (PageProps) são gerados pelo Next; num checkout novo ainda não existem
        run: npx next typegen && npx tsc --noEmit && npm run lint
      - name: Compilar o site
        run: npm run build
      # Sobe o site e abre a página inicial: se não abrir, mostra o erro do servidor (em vez de os testes
      # esperarem 3 minutos e só dizerem "tempo esgotado").
      - name: Conferir se o site abre
        run: |
          npm run start > servidor.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:3000/ && break; sleep 2; done
          codigo=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)
          echo "Página inicial respondeu $codigo"
          if [ "$codigo" != "200" ]; then
            echo "::error::O site não abriu (código $codigo). Erro do servidor abaixo:"
            tail -60 servidor.log
            exit 1
          fi
          kill %1
      - name: Navegador dos testes
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        run: npx playwright test
      - name: Guardar o relatório
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-dos-testes
          path: playwright-report/
          retention-days: 14
