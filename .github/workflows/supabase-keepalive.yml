# O Supabase gratuito pausa o projeto depois de cerca de uma semana sem uso. A cada 3 dias esta tarefa
# faz uma consulta pequena ao banco para ele continuar ativo. Se o banco estiver pausado ou fora do ar,
# a execução falha e o GitHub avisa por e-mail.
# Precisa dos secrets: NEXT_PUBLIC_SUPABASE_URL e NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY.
name: Manter o Supabase ativo

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar o banco
        env:
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" "$URL/rest/v1/items?select=id&limit=1" -H "apikey: $KEY" || echo 000)
          echo "Resposta do banco: $status"
          head -c 300 response.txt || true
          # 000 = não respondeu; 5xx = fora do ar ou pausado
          if [ "$status" = "000" ] || [ "$status" -ge 500 ]; then
            echo "::error::O Supabase não respondeu (status $status). Veja se o projeto está pausado no painel."
            exit 1
          fi
